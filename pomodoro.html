<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Profesional</title>
    <style>
        :root {
            --bg-color: #000000; /* Negro puro para OLED */
            --surface-color: #121212;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --danger-color: #cf6679;
            --success-color: #03dac6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        .container {
            background-color: var(--surface-color);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        .timer-display {
            font-size: 6rem;
            font-weight: 700;
            margin: 2rem 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, filter 0.3s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-main {
            background-color: var(--primary-color);
            color: var(--bg-color);
            width: 150px;
        }

        .btn-reset {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid #333;
        }

        .btn-reset:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .status-text {
            margin-top: 1.5rem;
            font-size: 1rem;
            color: #888;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" data-mode="pomodoro">Pomodoro</button>
            <button class="tab-btn" data-mode="shortBreak">Descanso Corto</button>
            <button class="tab-btn" data-mode="longBreak">Descanso Largo</button>
        </div>

        <div class="timer-display" id="time-display">25:00</div>

        <div class="controls">
            <button class="btn-main" id="start-btn">Iniciar</button>
            <button class="btn-reset" id="reset-btn">Reiniciar</button>
        </div>

        <div class="status-text" id="status-message">Tiempo de enfocarse.</div>
    </div>

    <script>
        const MODES = {
            pomodoro: { time: 25 * 60, message: "Tiempo de enfocarse." },
            shortBreak: { time: 5 * 60, message: "Toma un respiro rápido." },
            longBreak: { time: 15 * 60, message: "Desconecta y relájate un rato." }
        };

        let currentMode = 'pomodoro';
        let timeLeft = MODES[currentMode].time;
        let isRunning = false;
        let timerInterval = null;

        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusMessage = document.getElementById('status-message');
        const tabBtns = document.querySelectorAll('.tab-btn');

        // Formatear tiempo a MM:SS
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Actualizar la interfaz
        function updateDisplay() {
            timeDisplay.textContent = formatTime(timeLeft);
            document.title = `${formatTime(timeLeft)} - ${currentMode === 'pomodoro' ? 'Enfoque' : 'Descanso'}`;
        }

        // Cambiar de modo (Pomodoro, Descanso)
        function switchMode(mode) {
            if (isRunning) toggleTimer(); // Pausa si está corriendo
            
            currentMode = mode;
            timeLeft = MODES[mode].time;
            statusMessage.textContent = MODES[mode].message;
            
            tabBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) btn.classList.add('active');
            });
            
            updateDisplay();
        }

        // Lógica del temporizador
        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.textContent = 'Reanudar';
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.textContent = 'Pausar';
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateDisplay();

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        startBtn.textContent = 'Iniciar';
                        notifyUser();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            if (isRunning) toggleTimer();
            timeLeft = MODES[currentMode].time;
            startBtn.textContent = 'Iniciar';
            updateDisplay();
        }

        function notifyUser() {
            // Sonido simple usando Web Audio API
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Nota A5
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
            
            statusMessage.textContent = "¡Sesión terminada!";
        }

        // Event Listeners
        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => switchMode(btn.dataset.mode));
        });

        // Inicialización
        updateDisplay();
    </script>
</body>
</html>
